name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build src/TabbedNotepad.csproj -c Release

      - name: Upload TabbedNotepad.exe
        uses: actions/upload-artifact@v4
        with:
          name: TabbedNotepad
          path: src/bin/Release/net48/TabbedNotepad.exe

      # Opens the app on the Windows runner, checks the main features (undo, search, saving,
      # opening text files...) and takes the screenshots used in docs/user-guide.md.
      - name: Build feature checks
        run: dotnet build tools/Screenshots/Screenshots.csproj -c Release

      - name: Run feature checks and take screenshots
        timeout-minutes: 5
        run: tools/Screenshots/bin/Release/net48/Screenshots.exe screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
