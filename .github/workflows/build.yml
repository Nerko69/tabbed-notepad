name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Commit the new screenshots to docs/images on this branch
        type: boolean
        default: false

permissions:
  contents: write   # only used by the "Update screenshots" step, which runs when started by hand

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build src/TabbedNotepad.csproj -c Release

      - name: Upload TabbedNotepad.exe
        uses: actions/upload-artifact@v4
        with:
          name: TabbedNotepad
          path: src/bin/Release/net48/TabbedNotepad.exe

      # Opens the app on the Windows runner, checks the main features (undo, search, saving,
      # opening text files...) and takes the screenshots used in docs/user-guide.md.
      - name: Build feature checks
        run: dotnet build tools/Screenshots/Screenshots.csproj -c Release

      - name: Run feature checks and take screenshots
        timeout-minutes: 5
        run: |
          tools/Screenshots/bin/Release/net48/Screenshots.exe screenshots
          $code = $LASTEXITCODE
          Write-Host "Screenshots.exe exit code: $code"
          exit $code

      - name: Exit crash bisect (temporary)
        if: always()
        run: |
          foreach ($stop in @("11", "11a", "11b", "11c", "11d", "11e", "11f", "12", "11", "11b", "11c", "11d")) {
            $env:TN_STOP = $stop
            tools/Screenshots/bin/Release/net48/Screenshots.exe bisect | Select-String "Exit code|UNHANDLED|UNOBSERVED|failed"
            Write-Host "TN_STOP=$stop -> exit code $LASTEXITCODE"
          }
          exit 0

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Update screenshots in docs/images
        # Runs when started by hand with "update screenshots", or for a push whose commit message
        # contains [update screenshots].
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.update_screenshots) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[update screenshots]'))
        run: |
          New-Item -ItemType Directory -Force docs/images | Out-Null
          Copy-Item screenshots/[0-9]*.png docs/images/ -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update user guide screenshots"
            git push
          }
          exit 0
