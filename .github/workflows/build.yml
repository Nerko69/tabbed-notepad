name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Commit the new screenshots to docs/images on this branch
        type: boolean
        default: false

permissions:
  contents: write   # only used by the "Update screenshots" step, which runs when started by hand

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build src/TabbedNotepad.csproj -c Release

      - name: Upload TabbedNotepad.exe
        uses: actions/upload-artifact@v4
        with:
          name: TabbedNotepad
          path: src/bin/Release/net48/TabbedNotepad.exe

      # Opens the app on the Windows runner, checks the main features (undo, search, saving,
      # opening text files...) and takes the screenshots used in docs/user-guide.md.
      - name: Build feature checks
        run: dotnet build tools/Screenshots/Screenshots.csproj -c Release

      - name: Run feature checks and take screenshots
        timeout-minutes: 5
        run: tools/Screenshots/bin/Release/net48/Screenshots.exe screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Update screenshots in docs/images
        if: github.event_name == 'workflow_dispatch' && inputs.update_screenshots
        run: |
          New-Item -ItemType Directory -Force docs/images | Out-Null
          Copy-Item screenshots/0*.png docs/images/ -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update user guide screenshots"
            git push
          }
          exit 0
