name: Release

# Builds Tabbed Notepad, checks it, and publishes a GitHub release with TabbedNotepad.exe attached.
# Start it by pushing a version tag (e.g. v1.7.0), or by hand (Actions → Release → Run workflow) with
# the version: the tag is then created on the chosen branch. The release text comes from
# docs/releases/<tag>.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create and release, e.g. v1.7.0
        required: true

permissions:
  contents: write   # to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build src/TabbedNotepad.csproj -c Release

      - name: Run feature checks
        timeout-minutes: 5
        run: |
          dotnet build tools/Screenshots/Screenshots.csproj -c Release
          tools/Screenshots/bin/Release/net48/Screenshots.exe screenshots
          $code = $LASTEXITCODE
          Write-Host "Screenshots.exe exit code: $code"
          exit $code

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) { Set-Content $notes "Tabbed Notepad $tag" }
          gh release create $tag "src/bin/Release/net48/TabbedNotepad.exe" --target "${{ github.sha }}" --title "Tabbed Notepad $($tag.TrimStart('v'))" --notes-file $notes
